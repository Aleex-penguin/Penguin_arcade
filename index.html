            box-shadow: 0 0 10px #39ff14, inset 0 0 10px #39ff14;
            color: #ffffff;
            text-shadow: 0 0 5px #39ff14, 0 0 10px #39ff14;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            word-wrap: break-word; 
            /* Neon cyan link glow */
            text-shadow: 
                0 0 5px #fff, 
                0 0 10px #00ffff, 
                0 0 20px #00ffff, 
                0 0 40px #00ffff;
        }
        a:hover {
            text-decoration: none;
            /* Changes to neon pink on hover */
            text-shadow: 
                0 0 5px #fff, 
                0 0 10px #ff00de, 
                0 0 20px #ff00de, 
                0 0 40px #ff00de;
        }
    </style>
</head>
