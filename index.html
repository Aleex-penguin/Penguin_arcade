<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALEEX’S Penguin Arcade // FIELD TERMINAL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  :root {
    --phosphor: #33ff66;
    --phosphor-dim: #1a9933;
    --phosphor-bright: #99ffbb;
    --bg: #020804;
    --bezel: #1a1f1c;
    --metal: #2a302c;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0c0b;
    color: var(--phosphor);
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
  }

  /* Outer rugged case */
  .terminal-case {
    width: 96vw;
    max-width: 1100px;
    height: 92vh;
    background: linear-gradient(145deg, #1c211e, #121614);
    border: 8px solid #2a322e;
    border-radius: 12px;
    box-shadow: 
      0 0 0 4px #0a0c0b,
      inset 0 0 30px rgba(0,0,0,0.8),
      0 20px 50px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* Top status bar */
  .status-bar {
    height: 38px;
    background: #151a17;
    border-bottom: 2px solid #2a322e;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--phosphor-dim);
  }

  .status-left, .status-right {
    display: flex;
    gap: 18px;
    align-items: center;
  }

  .led {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #333;
    box-shadow: inset 0 0 3px #000;
  }

  .led.on {
    background: var(--phosphor);
    box-shadow: 0 0 8px var(--phosphor);
  }

  /* Main CRT screen */
  .crt-bezel {
    flex: 1;
    margin: 12px;
    background: #0a0c0b;
    border: 14px solid #1a221e;
    border-radius: 18px;
    position: relative;
    overflow: hidden;
    box-shadow: 
      inset 0 0 40px rgba(0,0,0,0.9),
      0 0 0 3px #0d120f;
  }

  .crt-screen {
    width: 100%;
    height: 100%;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Scanlines + phosphor glow */
  .crt-screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0, 0, 0, 0.25) 2px,
      rgba(0, 0, 0, 0.25) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  .crt-screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      transparent 50%,
      rgba(0, 0, 0, 0.55) 100%
    );
    pointer-events: none;
    z-index: 11;
  }

  /* Subtle screen flicker */
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 0.98; }
    94% { opacity: 0.94; }
    96% { opacity: 0.99; }
  }

  .crt-content {
    flex: 1;
    padding: 24px 28px;
    position: relative;
    z-index: 5;
    overflow-y: auto;
    animation: flicker 4s infinite;
  }

  /* Boot sequence */
  #boot-screen {
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .boot-line {
    opacity: 0;
    animation: bootFade 0.3s forwards;
  }

  @keyframes bootFade {
    to { opacity: 1; }
  }

  /* Main interface (hidden until boot finishes) */
  #main-interface {
    display: none;
    height: 100%;
    flex-direction: column;
  }

  .header {
    text-align: center;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--phosphor-dim);
    padding-bottom: 12px;
  }

  .header h1 {
    font-size: 28px;
    letter-spacing: 3px;
    text-shadow: 0 0 12px var(--phosphor);
    color: var(--phosphor-bright);
  }

  .header .subtitle {
    font-size: 13px;
    color: var(--phosphor-dim);
    margin-top: 4px;
  }

  /* Cartridge Bay */
  .cartridge-bay {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .bay-label {
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--phosphor-dim);
    border-left: 3px solid var(--phosphor);
    padding-left: 10px;
  }

  .slots {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }

  .cartridge {
    background: linear-gradient(160deg, #0d140f, #08100a);
    border: 2px solid var(--phosphor-dim);
    border-radius: 6px;
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .cartridge::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--phosphor-dim);
  }

  .cartridge:hover {
    border-color: var(--phosphor);
    box-shadow: 0 0 18px rgba(51, 255, 102, 0.25);
    transform: translateY(-3px);
  }

  .cartridge.active {
    border-color: var(--phosphor-bright);
    box-shadow: 0 0 25px rgba(51, 255, 102, 0.4);
    background: linear-gradient(160deg, #122018, #0a1810);
  }

  .cartridge.active::before {
    background: var(--phosphor);
    box-shadow: 0 0 10px var(--phosphor);
  }

  .cart-icon {
    font-size: 32px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 6px var(--phosphor));
  }

  .cart-name {
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .cart-status {
    font-size: 11px;
    color: var(--phosphor-dim);
  }

  .cartridge.active .cart-status {
    color: var(--phosphor);
  }

  /* Bottom command line */
  .command-line {
    margin-top: 18px;
    border-top: 1px solid var(--phosphor-dim);
    padding-top: 12px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .prompt {
    color: var(--phosphor-bright);
  }

  .cursor {
    display: inline-block;
    width: 10px;
    height: 16px;
    background: var(--phosphor);
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  /* Bottom physical controls */
  .controls {
    height: 70px;
    background: #151a17;
    border-top: 3px solid #2a322e;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
  }

  .btn {
    background: #1e2622;
    border: 2px solid #3a443e;
    color: var(--phosphor-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }

  .btn:hover {
    border-color: var(--phosphor);
    color: var(--phosphor);
    box-shadow: 0 0 10px rgba(51, 255, 102, 0.3);
  }

  .btn:active {
    transform: scale(0.96);
  }

  .power-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #3a443e, #1a201c);
    border: 3px solid #2a322e;
    cursor: pointer;
    position: relative;
  }

  .power-btn::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    border: 2px solid var(--phosphor-dim);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .power-btn.on::after {
    border-color: var(--phosphor);
    box-shadow: 0 0 8px var(--phosphor);
  }

  /* Game viewport (when a cartridge is inserted) */
  #game-viewport {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 20px;
  }

  .game-title {
    font-size: 32px;
    text-shadow: 0 0 15px var(--phosphor);
  }

  .game-desc {
    max-width: 500px;
    line-height: 1.6;
    color: var(--phosphor-dim);
  }

  /* Responsive */
  @media (max-width: 700px) {
    .header h1 { font-size: 20px; }
    .slots { grid-template-columns: 1fr 1fr; }
    .status-bar { font-size: 11px; }
  }
</style>
</head>
<body>

<div class="terminal-case">
  <!-- Top status bar -->
  <div class="status-bar">
    <div class="status-left">
      <div class="led on" id="power-led"></div>
      <span>SYS: ONLINE</span>
      <span>PWR: 98%</span>
    </div>
    <div class="status-right">
      <span id="clock">00:00:00</span>
      <span>FIELD UNIT // MK-7</span>
    </div>
  </div>

  <!-- CRT Bezel + Screen -->
  <div class="crt-bezel">
    <div class="crt-screen">
      <div class="crt-content">
        <!-- BOOT SEQUENCE -->
        <div id="boot-screen"></div>

        <!-- MAIN INTERFACE -->
        <div id="main-interface">
          <div class="header">
            <h1>ALEEX’S PENGUIN ARCADE</h1>
            <div class="subtitle">MILITARY FIELD TERMINAL • CARTRIDGE SYSTEM v2.4</div>
          </div>

          <div class="cartridge-bay">
            <div class="bay-label">CARTRIDGE BAY — SELECT UNIT TO INSERT</div>
            
            <div class="slots" id="slots">
              <!-- Cartridges will be injected here -->
            </div>
          </div>

          <div class="command-line">
            <span class="prompt">ROOT@PENGUIN:~$</span>
            <span id="cmd-text"> awaiting cartridge insertion_</span>
            <span class="cursor"></span>
          </div>
        </div>

        <!-- GAME VIEWPORT -->
        <div id="game-viewport">
          <div class="game-title" id="gv-title"></div>
          <div class="game-desc" id="gv-desc"></div>
          <button class="btn" onclick="ejectCartridge()">[ EJECT CARTRIDGE ]</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Physical controls -->
  <div class="controls">
    <div style="display:flex;gap:12px;">
      <button class="btn" onclick="location.reload()">REBOOT</button>
      <button class="btn" onclick="ejectCartridge()">EJECT</button>
    </div>
    <div class="power-btn on" id="power-btn" title="Power"></div>
    <div style="display:flex;gap:12px;">
      <button class="btn">BRIGHTNESS</button>
      <button class="btn">CONTRAST</button>
    </div>
  </div>
</div>

<script>
  // ========== CLOCK ==========
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ========== BOOT SEQUENCE ==========
  const bootLines = [
    "ALEEX FIELD COMPUTER SYSTEMS — MK-7 TERMINAL",
    "Copyright (c) 1987-2025 Penguin Dynamics Corp.",
    "------------------------------------------------",
    "",
    "POST: Memory check .................. [OK] 640K",
    "POST: Video adapter ................. [OK] P1 Phosphor",
    "POST: Input devices ................. [OK]",
    "POST: Cartridge interface ........... [OK]",
    "POST: Power systems ................. [OK] 98%",
    "",
    "Loading kernel ...................... [OK]",
    "Mounting secure volumes ............. [OK]",
    "Initializing arcade subsystem ....... [OK]",
    "Calibrating phosphor display ........ [OK]",
    "",
    "SYSTEM READY",
    "",
    "Welcome to ALEEX’S PENGUIN ARCADE",
    "Insert cartridge to begin..."
  ];

  async function runBoot() {
    const bootEl = document.getElementById('boot-screen');
    for (let i = 0; i < bootLines.length; i++) {
      const line = document.createElement('div');
      line.className = 'boot-line';
      line.style.animationDelay = '0s';
      line.textContent = bootLines[i] || ' ';
      bootEl.appendChild(line);
      // scroll to bottom
      bootEl.parentElement.scrollTop = bootEl.parentElement.scrollHeight;
      await new Promise(r => setTimeout(r, i < 4 ? 120 : 80));
    }
    await new Promise(r => setTimeout(r, 900));
    bootEl.style.display = 'none';
    document.getElementById('main-interface').style.display = 'flex';
    renderCartridges();
  }

  // ========== CARTRIDGES ==========
  const games = [
    {
      id: 'penguinfight',
      name: 'PENGUIN FIGHTER',
      icon: '🐧',
      status: 'READY',
      desc: 'Classic side-scrolling combat. Control the elite penguin special forces unit against the enemy empire. High-score mode enabled.'
    },
    {
      id: 'icetrench',
      name: 'ICE TRENCH',
      icon: '❄️',
      status: 'READY',
      desc: 'Tactical trench warfare simulator set in the frozen south. Dig, fortify, and hold the line against wave attacks.'
    },
    {
      id: 'deepops',
      name: 'DEEP OPS',
      icon: '🎖️',
      status: 'READY',
      desc: 'Stealth infiltration mission. Navigate dark corridors, avoid detection, and extract the target. Hardcore difficulty.'
    },
    {
      id: 'radarscan',
      name: 'RADAR SWEEP',
      icon: '📡',
      status: 'READY',
      desc: 'Real-time strategy. Manage radar coverage, allocate interceptors, and defend the colony from aerial threats.'
    },
    {
      id: 'supplyrun',
      name: 'SUPPLY RUN',
      icon: '📦',
      status: 'READY',
      desc: 'Logistics puzzle. Route supply convoys across hostile terrain while managing fuel, ammo, and morale.'
    },
    {
      id: 'empty1',
      name: 'EMPTY SLOT',
      icon: '⬛',
      status: 'NO CART',
      desc: 'No cartridge detected. Insert a game cartridge into this bay.'
    }
  ];

  let activeCart = null;

  function renderCartridges() {
    const container = document.getElementById('slots');
    container.innerHTML = '';
    games.forEach(game => {
      const div = document.createElement('div');
      div.className = 'cartridge' + (activeCart === game.id ? ' active' : '');
      div.innerHTML = `
        <div class="cart-icon">${game.icon}</div>
        <div class="cart-name">${game.name}</div>
        <div class="cart-status">${game.status}</div>
      `;
      div.onclick = () => insertCartridge(game);
      container.appendChild(div);
    });
  }

  function insertCartridge(game) {
    if (game.status === 'NO CART') {
      document.getElementById('cmd-text').textContent = ' ERROR: No cartridge present in selected slot_';
      return;
    }

    activeCart = game.id;
    renderCartridges();

    // Switch to game view
    document.getElementById('main-interface').style.display = 'none';
    const gv = document.getElementById('game-viewport');
    gv.style.display = 'flex';
    document.getElementById('gv-title').textContent = game.name;
    document.getElementById('gv-desc').textContent = game.desc + '\n\n[ GAME MODULE LOADED — PRESS EJECT TO RETURN ]';

    document.getElementById('cmd-text').textContent = ` loaded ${game.name.toLowerCase()}_`;
  }

  function ejectCartridge() {
    activeCart = null;
    document.getElementById('game-viewport').style.display = 'none';
    document.getElementById('main-interface').style.display = 'flex';
    renderCartridges();
    document.getElementById('cmd-text').textContent = ' cartridge ejected — system idle_';
  }

  // Start boot
  window.onload = runBoot;
</script>
</body>
</html>
