<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aleex's Penguin Arcade</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Import a futuristic neon-style font */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            font-family: 'Orbitron', Arial, sans-serif;
            background-color: #0a0a0a; /* Dark background to make the neon pop */
            color: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            border-bottom: 2px solid #ff00de; /* Neon pink border */
            padding-bottom: 10px;
            color: #ffffff;
            /* Neon pink text glow */
            text-shadow: 
                0 0 5px #fff, 
                0 0 10px #fff, 
                0 0 20px #ff00de, 
                0 0 40px #ff00de, 
                0 0 80px #ff00de;
        }
        p {
            /* Subtle neon blue glow for plain text */
            text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #111111;
            margin: 15px 0;
            padding: 15px;
            border-radius: 5px;
            /* Neon green box border and glow */
            border: 1px solid #39ff14;
            box-shadow: 0 0 10px #39ff14, inset 0 0 10px #39ff14;
            color: #ffffff;
            text-shadow: 0 0 5px #39ff14, 0 0 10px #39ff14;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            word-wrap: break-word; 
            /* Neon cyan link glow */
            text-shadow: 
                0 0 5px #fff, 
                0 0 10px #00ffff, 
                0 0 20px #00ffff, 
                0 0 40px #00ffff;
        }
        a:hover {
            text-decoration: none;
            /* Changes to neon pink on hover */
            text-shadow: 
                0 0 5px #fff, 
                0 0 10px #ff00de, 
                0 0 20px #ff00de, 
                0 0 40px #ff00de;
        }
    </style>
</head>
<body>
    <h1>Aleex's Penguin Arcade</h1>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quad-Realm Survival</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent pinch zoom on mobile */
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas */
        }
        .interactive {
            pointer-events: auto;
        }
        .health-bar-container {
            width: 200px;
            height: 20px;
            background-color: #4b5563;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #1f2937;
        }
        #healthBar {
            height: 100%;
            background-color: #ef4444;
            width: 100%;
            transition: width 0.2s ease-out;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer flex flex-col justify-between p-4">
        <!-- HUD -->
        <div id="hud" class="hidden flex justify-between items-start">
            <div>
                <div class="text-white font-bold text-xl drop-shadow-md mb-2">HP</div>
                <div class="health-bar-container shadow-lg">
                    <div id="healthBar"></div>
                </div>
            </div>
            <div class="text-right">
                <div class="text-white font-bold text-3xl drop-shadow-md" id="scoreDisplay">0</div>
                <div class="text-gray-300 font-semibold text-sm drop-shadow-md mt-1" id="zoneDisplay">Zone: City</div>
            </div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="mainMenu" class="ui-layer interactive flex items-center justify-center bg-black bg-opacity-80 backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl text-center max-w-md w-full border border-gray-700">
            <h1 class="text-4xl font-extrabold text-white mb-2 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">Quad-Realm</h1>
            <p class="text-gray-400 mb-6">Survive the 4 distinct zones. Use WASD/Arrows to move, Mouse to aim and click to shoot.</p>
            <button id="startBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-transform transform hover:scale-105 active:scale-95">
                Start Survival
            </button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="ui-layer interactive hidden flex items-center justify-center bg-red-900 bg-opacity-90 backdrop-blur-sm">
        <div class="bg-gray-900 p-8 rounded-2xl shadow-2xl text-center max-w-md w-full border border-red-700">
            <h1 class="text-5xl font-black text-red-500 mb-4 drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]">GAME OVER</h1>
            <p class="text-gray-300 text-lg mb-2">You survived for a while.</p>
            <p class="text-2xl text-white font-bold mb-6">Final Score: <span id="finalScore" class="text-yellow-400">0</span></p>
            <button id="restartBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-transform transform hover:scale-105 active:scale-95">
                Play Again
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const mainMenu = document.getElementById('mainMenu');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const hud = document.getElementById('hud');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const healthBar = document.getElementById('healthBar');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScoreDisplay = document.getElementById('finalScore');
        const zoneDisplay = document.getElementById('zoneDisplay');

        // World Config
        const WORLD_SIZE = 3000;
        const HALF_WORLD = WORLD_SIZE / 2;
        
        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
        let score = 0;
        let lastTime = 0;

        // Resize handler
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const keys = {
            w: false, a: false, s: false, d: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false
        };
        const mouse = { x: 0, y: 0, worldX: 0, worldY: 0, isDown: false };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', () => mouse.isDown = true);
        window.addEventListener('mouseup', () => mouse.isDown = false);
        
        // Touch support for shooting/aiming
        window.addEventListener('touchstart', (e) => {
            if(gameState !== 'PLAYING') return;
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.isDown = true;
        });
        window.addEventListener('touchmove', (e) => {
             if(gameState !== 'PLAYING') return;
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        window.addEventListener('touchend', () => mouse.isDown = false);


        class Player {
            constructor() {
                this.x = HALF_WORLD;
                this.y = HALF_WORLD;
                this.radius = 20;
                this.speed = 300; // pixels per second
                this.maxHp = 100;
                this.hp = this.maxHp;
                this.color = '#3b82f6';
                this.lastShot = 0;
                this.fireRate = 150; // ms between shots
            }

            update(dt) {
                let dx = 0;
                let dy = 0;
                if (keys.w || keys.ArrowUp) dy -= 1;
                if (keys.s || keys.ArrowDown) dy += 1;
                if (keys.a || keys.ArrowLeft) dx -= 1;
                if (keys.d || keys.ArrowRight) dx += 1;

                // Normalize diagonal movement
                if (dx !== 0 && dy !== 0) {
                    const length = Math.sqrt(dx * dx + dy * dy);
                    dx /= length;
                    dy /= length;
                }

                this.x += dx * this.speed * dt;
                this.y += dy * this.speed * dt;

                // Clamp to world bounds
                this.x = Math.max(this.radius, Math.min(WORLD_SIZE - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(WORLD_SIZE - this.radius, this.y));
                
                // Determine current zone
                let zone = "Center";
                if(this.x < HALF_WORLD && this.y < HALF_WORLD) zone = "City";
                else if (this.x >= HALF_WORLD && this.y < HALF_WORLD) zone = "Desert";
                else if (this.x < HALF_WORLD && this.y >= HALF_WORLD) zone = "Snow";
                else if (this.x >= HALF_WORLD && this.y >= HALF_WORLD) zone = "Farm";
                zoneDisplay.innerText = `Zone: ${zone}`;

                // Handle Shooting
                if (mouse.isDown && performance.now() - this.lastShot > this.fireRate) {
                    this.shoot();
                    this.lastShot = performance.now();
                }
            }

            shoot() {
                const angle = Math.atan2(mouse.worldY - this.y, mouse.worldX - this.x);
                projectiles.push(new Projectile(this.x, this.y, angle));
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#1e3a8a';
                ctx.stroke();

                // Draw aiming barrel
                const angle = Math.atan2(mouse.worldY - this.y, mouse.worldX - this.x);
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + Math.cos(angle) * (this.radius + 15), this.y + Math.sin(angle) * (this.radius + 15));
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#9ca3af';
                ctx.stroke();
            }
        }

        class Projectile {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * 800; // speed
                this.vy = Math.sin(angle) * 800;
                this.radius = 6;
                this.color = '#fef08a';
                this.active = true;
                this.distance = 0;
                this.maxDistance = 1000;
            }

            update(dt) {
                const dx = this.vx * dt;
                const dy = this.vy * dt;
                this.x += dx;
                this.y += dy;
                this.distance += Math.sqrt(dx*dx + dy*dy);

                if (this.distance > this.maxDistance || 
                    this.x < 0 || this.x > WORLD_SIZE || 
                    this.y < 0 || this.y > WORLD_SIZE) {
                    this.active = false;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 0; // reset
            }
        }

        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.active = true;
                
                // Configure based on quadrant/type
                switch(type) {
                    case 'City': // Fast, weak
                        this.color = '#374151'; // Dark gray
                        this.radius = 16;
                        this.speed = 180;
                        this.hp = 20;
                        this.damage = 10;
                        break;
                    case 'Desert': // Swarm, erratic
                        this.color = '#ea580c'; // Orange
                        this.radius = 14;
                        this.speed = 220;
                        this.hp = 15;
                        this.damage = 5;
                        break;
                    case 'Snow': // Tanky, slow
                        this.color = '#0891b2'; // Cyan
                        this.radius = 28;
                        this.speed = 80;
                        this.hp = 60;
                        this.damage = 25;
                        break;
                    case 'Farm': // Average
                        this.color = '#b45309'; // Amber brown
                        this.radius = 20;
                        this.speed = 130;
                        this.hp = 30;
                        this.damage = 15;
                        break;
                }
            }

            update(dt, target) {
                const angle = Math.atan2(target.y - this.y, target.x - this.x);
                this.x += Math.cos(angle) * this.speed * dt;
                this.y += Math.sin(angle) * this.speed * dt;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 200 + 50;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0; // 1 second
                this.decay = Math.random() * 0.5 + 0.5;
                this.size = Math.random() * 4 + 2;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= this.decay * dt;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        let player;
        let projectiles = [];
        let enemies = [];
        let particles = [];
        let decorations = [];

        function generateMapDecorations() {
            decorations = [];
            const numDecorationsPerZone = 50;

            for(let i=0; i<4; i++) {
                let zoneX = (i % 2) * HALF_WORLD;
                let zoneY = Math.floor(i / 2) * HALF_WORLD;
                let type = ['City', 'Desert', 'Snow', 'Farm'][i];

                for(let j=0; j<numDecorationsPerZone; j++) {
                    decorations.push({
                        x: zoneX + Math.random() * HALF_WORLD,
                        y: zoneY + Math.random() * HALF_WORLD,
                        type: type,
                        size: Math.random() * 30 + 10
                    });
                }
            }
        }

        function initGame() {
            player = new Player();
            projectiles = [];
            enemies = [];
            particles = [];
            score = 0;
            scoreDisplay.innerText = score;
            updateHealthBar();
            generateMapDecorations();
            
            gameState = 'PLAYING';
            mainMenu.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            lastTime = performance.now();
            
            requestAnimationFrame(gameLoop);
        }

        function spawnEnemy() {
            if(gameState !== 'PLAYING') return;
            
            // Spawn outside camera view but within world bounds
            let angle = Math.random() * Math.PI * 2;
            let distance = Math.max(canvas.width, canvas.height) / 1.5 + Math.random() * 200;
            
            let ex = player.x + Math.cos(angle) * distance;
            let ey = player.y + Math.sin(angle) * distance;

            // Clamp to world
            ex = Math.max(0, Math.min(WORLD_SIZE, ex));
            ey = Math.max(0, Math.min(WORLD_SIZE, ey));

            // Determine type based on spawn location
            let type = 'City';
            if(ex >= HALF_WORLD && ey < HALF_WORLD) type = 'Desert';
            else if(ex < HALF_WORLD && ey >= HALF_WORLD) type = 'Snow';
            else if(ex >= HALF_WORLD && ey >= HALF_WORLD) type = 'Farm';

            enemies.push(new Enemy(ex, ey, type));
            
            // Schedule next spawn based on score (gets faster)
            let spawnDelay = Math.max(200, 1500 - score * 5);
            setTimeout(spawnEnemy, spawnDelay);
        }

        function updateHealthBar() {
            const pct = Math.max(0, (player.hp / player.maxHp) * 100);
            healthBar.style.width = pct + '%';
            if(pct < 30) healthBar.style.backgroundColor = '#991b1b';
            else healthBar.style.backgroundColor = '#ef4444';
        }

        function checkCollisions() {
            // Projectiles hits Enemies
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const dist = Math.hypot(p.x - e.x, p.y - e.y);
                    if (dist < p.radius + e.radius) {
                        e.hp -= 15; // Weapon damage
                        p.active = false;
                        
                        // Hit effect
                        for(let k=0; k<3; k++) particles.push(new Particle(p.x, p.y, '#fef08a'));

                        if (e.hp <= 0) {
                            e.active = false;
                            score += 10;
                            scoreDisplay.innerText = score;
                            // Death particles
                            for(let k=0; k<15; k++) particles.push(new Particle(e.x, e.y, e.color));
                        }
                        break; // bullet dead, stop checking this bullet
                    }
                }
            }

            // Enemies hit Player
            for (let e of enemies) {
                if(!e.active) continue;
                const dist = Math.hypot(player.x - e.x, player.y - e.y);
                if (dist < player.radius + e.radius) {
                    player.hp -= e.damage;
                    updateHealthBar();
                    e.active = false; // Enemy dies on impact
                    
                    // Player hit effect
                    for(let k=0; k<10; k++) particles.push(new Particle(player.x, player.y, '#ef4444'));

                    if (player.hp <= 0) {
                        endGame();
                        return;
                    }
                }
            }
        }

        function endGame() {
            gameState = 'GAMEOVER';
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            finalScoreDisplay.innerText = score;
        }

        function drawMap() {
            // City (Top-Left)
            ctx.fillStyle = '#64748b'; // slate-500
            ctx.fillRect(0, 0, HALF_WORLD, HALF_WORLD);
            // Desert (Top-Right)
            ctx.fillStyle = '#fcd34d'; // amber-300
            ctx.fillRect(HALF_WORLD, 0, HALF_WORLD, HALF_WORLD);
            // Snow (Bottom-Left)
            ctx.fillStyle = '#e0f2fe'; // sky-100
            ctx.fillRect(0, HALF_WORLD, HALF_WORLD, HALF_WORLD);
            // Farm (Bottom-Right)
            ctx.fillStyle = '#86efac'; // green-300
            ctx.fillRect(HALF_WORLD, HALF_WORLD, HALF_WORLD, HALF_WORLD);

            // Draw World Borders
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 10;
            ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);
            
            // Draw Quadrant lines
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.moveTo(HALF_WORLD, 0); ctx.lineTo(HALF_WORLD, WORLD_SIZE);
            ctx.moveTo(0, HALF_WORLD); ctx.lineTo(WORLD_SIZE, HALF_WORLD);
            ctx.stroke();

            // Draw Decorations
            decorations.forEach(dec => {
                ctx.beginPath();
                if(dec.type === 'City') {
                    ctx.fillStyle = '#334155'; // dark slate
                    ctx.fillRect(dec.x - dec.size/2, dec.y - dec.size/2, dec.size, dec.size);
                } else if(dec.type === 'Desert') {
                    ctx.fillStyle = '#d97706'; // amber-600 (rock/cactus)
                    ctx.arc(dec.x, dec.y, dec.size/2, 0, Math.PI*2);
                    ctx.fill();
                } else if(dec.type === 'Snow') {
                    ctx.fillStyle = '#bae6fd'; // sky-200 (ice)
                    ctx.moveTo(dec.x, dec.y - dec.size/2);
                    ctx.lineTo(dec.x + dec.size/2, dec.y + dec.size/2);
                    ctx.lineTo(dec.x - dec.size/2, dec.y + dec.size/2);
                    ctx.fill();
                } else if(dec.type === 'Farm') {
                    ctx.fillStyle = '#78350f'; // amber-900 (fence/hay)
                    ctx.fillRect(dec.x - dec.size/2, dec.y - dec.size/4, dec.size, dec.size/2);
                }
            });
        }

        function gameLoop(currentTime) {
            if (gameState !== 'PLAYING') return;

            const dt = (currentTime - lastTime) / 1000; // delta time in seconds
            lastTime = currentTime;

            // Update Camera offsets to follow player
            const cameraX = player.x - canvas.width / 2;
            const cameraY = player.y - canvas.height / 2;
            
            // Update Mouse world position
            mouse.worldX = mouse.x + cameraX;
            mouse.worldY = mouse.y + cameraY;

            // Update Entities
            player.update(dt);
            
            projectiles.forEach(p => p.update(dt));
            projectiles = projectiles.filter(p => p.active);
            
            enemies.forEach(e => e.update(dt, player));
            enemies = enemies.filter(e => e.active);
            
            particles.forEach(p => p.update(dt));
            particles = particles.filter(p => p.life > 0);

            checkCollisions();

            if (gameState !== 'PLAYING') return; // Might have ended during checkCollisions

            // DRAWING
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            drawMap();
            
            particles.forEach(p => p.draw());
            projectiles.forEach(p => p.draw());
            enemies.forEach(e => e.draw());
            player.draw();

            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', () => {
            initGame();
            setTimeout(spawnEnemy, 1000); // Start spawning after 1 sec
        });

        restartBtn.addEventListener('click', () => {
            initGame();
            setTimeout(spawnEnemy, 1000);
        });

        // Initial draw just to show something nice in background of menu
        ctx.fillStyle = '#1f2937';
        ctx.fillRect(0,0, canvas.width, canvas.height);
        
    </script>
</body>
</html>
