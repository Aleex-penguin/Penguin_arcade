<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALEEX’S Penguin Arcade // FIELD TERMINAL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  :root {
    --phosphor: #33ff66;
    --phosphor-dim: #1a9933;
    --phosphor-bright: #99ffbb;
    --bg: #020804;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0c0b;
    color: var(--phosphor);
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
  }

  .terminal-case {
    width: 96vw;
    max-width: 1100px;
    height: 92vh;
    background: linear-gradient(145deg, #1c211e, #121614);
    border: 8px solid #2a322e;
    border-radius: 12px;
    box-shadow: 
      0 0 0 4px #0a0c0b,
      inset 0 0 30px rgba(0,0,0,0.8),
      0 20px 50px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .status-bar {
    height: 38px;
    background: #151a17;
    border-bottom: 2px solid #2a322e;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--phosphor-dim);
  }

  .status-left, .status-right {
    display: flex;
    gap: 18px;
    align-items: center;
  }

  .led {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #333;
    box-shadow: inset 0 0 3px #000;
  }

  .led.on {
    background: var(--phosphor);
    box-shadow: 0 0 8px var(--phosphor);
  }

  .crt-bezel {
    flex: 1;
    margin: 12px;
    background: #0a0c0b;
    border: 14px solid #1a221e;
    border-radius: 18px;
    position: relative;
    overflow: hidden;
    box-shadow: 
      inset 0 0 40px rgba(0,0,0,0.9),
      0 0 0 3px #0d120f;
  }

  .crt-screen {
    width: 100%;
    height: 100%;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .crt-screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0, 0, 0, 0.25) 2px,
      rgba(0, 0, 0, 0.25) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  .crt-screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      transparent 50%,
      rgba(0, 0, 0, 0.55) 100%
    );
    pointer-events: none;
    z-index: 11;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 0.98; }
    94% { opacity: 0.94; }
    96% { opacity: 0.99; }
  }

  .crt-content {
    flex: 1;
    padding: 24px 28px;
    position: relative;
    z-index: 5;
    overflow-y: auto;
    animation: flicker 4s infinite;
  }

  #boot-screen {
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .boot-line {
    opacity: 0;
    animation: bootFade 0.3s forwards;
  }

  @keyframes bootFade {
    to { opacity: 1; }
  }

  #main-interface {
    display: none;
    height: 100%;
    flex-direction: column;
  }

  .header {
    text-align: center;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--phosphor-dim);
    padding-bottom: 14px;
  }

  .header h1 {
    font-size: 28px;
    letter-spacing: 3px;
    text-shadow: 0 0 12px var(--phosphor);
    color: var(--phosphor-bright);
  }

  .header .subtitle {
    font-size: 13px;
    color: var(--phosphor-dim);
    margin-top: 4px;
  }

  .cartridge-bay {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
  }

  .bay-label {
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--phosphor-dim);
    border-left: 3px solid var(--phosphor);
    padding-left: 10px;
    align-self: flex-start;
  }

  /* Single large cartridge */
  .cartridge {
    width: 280px;
    background: linear-gradient(160deg, #0d140f, #08100a);
    border: 3px solid var(--phosphor-dim);
    border-radius: 8px;
    padding: 0;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 1px #0a100c;
  }

  .cartridge:hover {
    border-color: var(--phosphor);
    box-shadow: 0 0 28px rgba(51, 255, 102, 0.35);
    transform: translateY(-4px) scale(1.02);
  }

  .cartridge-image {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
    border-bottom: 2px solid var(--phosphor-dim);
  }

  .cartridge-info {
    padding: 16px 14px 18px;
  }

  .cart-name {
    font-size: 20px;
    letter-spacing: 2px;
    margin-bottom: 6px;
    color: var(--phosphor-bright);
    text-shadow: 0 0 8px var(--phosphor);
  }

  .cart-status {
    font-size: 12px;
    color: var(--phosphor);
    letter-spacing: 1px;
  }

  .command-line {
    margin-top: 20px;
    border-top: 1px solid var(--phosphor-dim);
    padding-top: 14px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .prompt {
    color: var(--phosphor-bright);
  }

  .cursor {
    display: inline-block;
    width: 10px;
    height: 16px;
    background: var(--phosphor);
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .controls {
    height: 70px;
    background: #151a17;
    border-top: 3px solid #2a322e;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
  }

  .btn {
    background: #1e2622;
    border: 2px solid #3a443e;
    color: var(--phosphor-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }

  .btn:hover {
    border-color: var(--phosphor);
    color: var(--phosphor);
    box-shadow: 0 0 10px rgba(51, 255, 102, 0.3);
  }

  .btn:active {
    transform: scale(0.96);
  }

  .power-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #3a443e, #1a201c);
    border: 3px solid #2a322e;
    cursor: pointer;
    position: relative;
  }

  .power-btn::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    border: 2px solid var(--phosphor-dim);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .power-btn.on::after {
    border-color: var(--phosphor);
    box-shadow: 0 0 8px var(--phosphor);
  }

  @media (max-width: 700px) {
    .header h1 { font-size: 20px; }
    .cartridge { width: 240px; }
    .cartridge-image { height: 150px; }
  }
</style>
</head>

<script>
  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = 
      String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0') + ':' +
      String(now.getSeconds()).padStart(2,'0');
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Boot sequence
  const bootLines = [
    "ALEEX FIELD COMPUTER SYSTEMS — MK-7 TERMINAL",
    "Copyright (c) 1987-2025 Penguin Dynamics Corp.",
    "------------------------------------------------",
    "",
    "POST: Memory check .................. [OK] 640K",
    "POST: Video adapter ................. [OK] P1 Phosphor",
    "POST: Input devices ................. [OK]",
    "POST: Cartridge interface ........... [OK]",
    "POST: Power systems ................. [OK] 98%",
    "",
    "Loading kernel ...................... [OK]",
    "Mounting secure volumes ............. [OK]",
    "Initializing arcade subsystem ....... [OK]",
    "Calibrating phosphor display ........ [OK]",
    "",
    "SYSTEM READY",
    "",
    "Welcome to ALEEX’S PENGUIN ARCADE",
    "Insert cartridge to begin..."
  ];

  async function runBoot() {
    const bootEl = document.getElementById('boot-screen');
    for (let i = 0; i < bootLines.length; i++) {
      const line = document.createElement('div');
      line.className = 'boot-line';
      line.textContent = bootLines[i] || ' ';
      bootEl.appendChild(line);
      bootEl.parentElement.scrollTop = bootEl.parentElement.scrollHeight;
      await new Promise(r => setTimeout(r, i < 4 ? 110 : 75));
    }
    await new Promise(r => setTimeout(r, 800));
    bootEl.style.display = 'none';
    document.getElementById('main-interface').style.display = 'flex';
  }

  // Launch DELTA OPS
  function launchDeltaOps() {
    document.getElementById('cmd-text').textContent = ' deploying DELTA OPS...';
    setTimeout(() => {
      window.open('https://deltaopsishere.oneapp.dev/', '_blank');
      document.getElementById('cmd-text').textContent = ' DELTA OPS deployed — standby_';
    }, 400);
  }

  window.onload = runBoot;
</script>
</body>
</html>
